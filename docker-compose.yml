services:
  bob_server:
    image: ${DOCKER_IMAGE:-nguyenkhangphuc/qkd-simulation:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bob_server
    command: ["uvicorn", "bob_server:app", "--host", "0.0.0.0", "--port", "8000"]
    networks:
      - qkd-network
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      # Use python's standard library to perform a lightweight healthcheck without needing curl/wget
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/classical_channel/bases')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  alice_client:
    image: ${DOCKER_IMAGE:-nguyenkhangphuc/qkd-simulation:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alice_client
    command: ["uvicorn", "alice_client:app", "--host", "0.0.0.0", "--port", "8001"]
    expose:
      - "8001" # Exposed internally for Caddy, removed direct host mapping for security
    environment:
      - BOB_SERVER_URL=http://bob_server:8000
    networks:
      - qkd-network
    restart: unless-stopped
    depends_on:
      bob_server:
        condition: service_healthy

  caddy:
    image: caddy:2.7-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - qkd-network
    depends_on:
      - alice_client

volumes:
  caddy_data:
  caddy_config:

networks:
  qkd-network:
    driver: bridge
